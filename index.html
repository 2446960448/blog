<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小秦的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.03) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.5;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 50px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 50px;
            text-align: center;
        }

        .hero {
            padding: 60px 0;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffff, #0080ff);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 30px rgba(0, 255, 255, 0.3); }
            to { box-shadow: 0 0 50px rgba(0, 255, 255, 0.5); }
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00ffff, #0080ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-size: 20px;
            color: #00ffff;
            margin-bottom: 15px;
        }

        .intro {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }

        .typing-effect {
            display: inline-block;
            border-right: 2px solid #00ffff;
            animation: blink 0.7s infinite;
            padding-right: 5px;
        }

        @keyframes blink {
            0%, 100% { border-color: #00ffff; }
            50% { border-color: transparent; }
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .skill-tag {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            color: #00ffff;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #00ffff;
            display: block;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 5px;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .功能按钮区域 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .功能按钮 {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .功能按钮:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.15);
            background: rgba(0, 255, 255, 0.05);
        }

        .功能按钮 .图标 {
            font-size: 40px;
        }

        .功能按钮 .标题 {
            font-size: 18px;
            font-weight: bold;
            color: #00ffff;
        }

        .功能按钮 .描述 {
            font-size: 13px;
            color: #888;
        }

        .访客计数 {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 13px;
            color: #00ffff;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid rgba(0, 255, 255, 0.1);
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            nav {
                padding: 12px 20px;
                flex-direction: column;
                gap: 10px;
            }

            h1 {
                font-size: 36px;
            }

            .container {
                padding: 120px 15px 30px;
            }

            .stats {
                gap: 30px;
            }

            .功能按钮区域 {
                grid-template-columns: 1fr 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <nav>
        <div class="logo">小秦</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="blog.html">博客</a>
            <a href="projects.html">项目</a>
            <a href="message.html">留言</a>
            <a href="contact.html">联系</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <div class="avatar">秦</div>
            <h1>小秦</h1>
            <p class="subtitle">技术专员</p>
            <p class="intro"><span class="typing-effect">我就是小秦</span></p>
            
            <div class="skills">
                <span class="skill-tag">网络冲浪</span>
                <span class="skill-tag">技术探索</span>
                <span class="skill-tag">问题解决</span>
                <span class="skill-tag">前端开发</span>
                <span class="skill-tag">Python</span>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number">3</span>
                    <span class="stat-label">文章</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">2</span>
                    <span class="stat-label">项目</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number"><span class="状态" style="display:inline-block;width:10px;height:10px;background:#00ff00;border-radius:50%;animation:statusPulse 2s infinite;"></span> 在线</span>
                    <span class="stat-label">状态</span>
                </div>
            </div>

            <div class="功能按钮区域">
                <a href="blog.html" class="功能按钮">
                    <span class="图标">📝</span>
                    <span class="标题">博客文章</span>
                    <span class="描述">分享技术与生活</span>
                </a>
                <a href="projects.html" class="功能按钮">
                    <span class="图标">🚀</span>
                    <span class="标题">我的项目</span>
                    <span class="description">展示开源作品</span>
                </a>
                <a href="message.html" class="功能按钮">
                    <span class="图标">💬</span>
                    <span class="标题">留言板</span>
                    <span class="描述">欢迎留言交流</span>
                </a>
                <a href="contact.html" class="功能按钮">
                    <span class="图标">📮</span>
                    <span class="标题">联系我</span>
                    <span class="描述">随时保持联系</span>
                </a>
            </div>

            <div class="访客计数">
                👁️ 访客: <span id="访客数">0</span>
            </div>
        </section>
    </div>

    <footer>
        <p>© 2026 小秦的个人博客 | 保留所有权利</p>
    </footer>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        let count = localStorage.getItem('访客数') || 0;
        count = parseInt(count) + 1;
        localStorage.setItem('访客数', count);
        document.getElementById('访客数').textContent = count;
    </script>
</body>
</html>
